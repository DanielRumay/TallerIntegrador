spring.application.name=TallerIntegrador

server.servlet.context-path=/api

# =========================
# DEBUG & LOGGING
# =========================
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# =========================
# POSTGRESQL
# =========================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/colegio_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}

# En produccion usar "validate" con migraciones versionadas; "update" solo en desarrollo.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=true

spring.sql.init.mode=never
spring.sql.init.data-locations=classpath:data-test.sql
spring.jpa.defer-datasource-initialization=true

# =========================
# MULTIPART / FILE UPLOADS
# =========================
# =========================
# OCR (lectura de PDF escaneados)
# =========================
# APAGADO por defecto. Solo tiene efecto si ademas esta instalado el ejecutable `tesseract`
# en el sistema; sin el, Tika lo omite en silencio y parecera que funciona sin hacer nada.
# Actívalo poniendolo en true SOLO despues de comprobar que `tesseract --version` responde.
# Con OCR, un documento escaneado de cientos de paginas puede tardar varios minutos.
ocr.habilitado=false
ocr.idioma=spa
ocr.dpi=300
ocr.tiempo-limite-segundos=300
# IMPORTANTE: Tesseract debe estar en el PATH del proceso. En Tika 2.x la ruta ya no se puede
# fijar por configuracion. Dentro del contenedor Docker lo esta (el Dockerfile lo instala);
# en Windows el instalador lo deja en "C:\Program Files\Tesseract-OCR" SIN anadirlo al PATH,
# asi que hay que anadirlo a mano o el OCR se omitira en silencio.

# 15MB y no 25MB por un motivo concreto: ArchivoPrompt guarda el PDF como byte[] dentro de un
# documento Mongo normal (no GridFS), y MongoDB tiene un limite duro de 16MB por documento.
# Con 25MB, un archivo de entre 16 y 25MB pasaba la validacion de subida y reventaba DESPUES,
# en Mongo, con un error que no explicaba nada. Ahora se rechaza al subir, que es donde el
# docente puede entenderlo. Para admitir archivos mayores hay que migrar a GridFS primero.
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# =========================
# MONGODB
# =========================
spring.data.mongodb.uri=${MONGO_URI:mongodb://127.0.0.1:27017/colegio_mongo}

GOOGLE_PRIVATE_API_KEY=${GOOGLE_API_KEY:changeme-google-key}

jwt.secret=${JWT_SECRET_KEY:changeme-jwt-secret-at-least-32-chars}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

app.dominio-institucional=${DOMINIO_EMAIL:gmail.com}

# =========================
# LANGCHAIN4J + GEMINI (Smart Assess)
# =========================
langchain4j.google-ai-gemini.chat-model.api-key=${GEMINI_API_KEY:changeme-gemini-key}
langchain4j.google-ai-gemini.chat-model.model-name=gemini-3.1-flash-lite
gemini.chat-model.fallback-name=gemini-2.5-flash
langchain4j.google-ai-gemini.chat-model.temperature=0.7
langchain4j.google-ai-gemini.chat-model.log-requests=false
langchain4j.google-ai-gemini.chat-model.log-responses=false

qdrant.host=${QDRANT_HOST:localhost}
qdrant.port=${QDRANT_PORT:6334}

app.gemini.simulado=${GEMINI_SIMULADO:false}