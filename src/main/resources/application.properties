spring.application.name=TallerIntegrador

server.servlet.context-path=/api

# =========================
# DEBUG & LOGGING
# =========================
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# =========================
# POSTGRESQL
# =========================
spring.datasource.url=jdbc:postgresql://localhost:5432/colegio_db
spring.datasource.username=postgres
spring.datasource.password=admin

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.sql.init.mode=never
spring.sql.init.data-locations=classpath:data-test.sql
spring.jpa.defer-datasource-initialization=true

# =========================
# MULTIPART / FILE UPLOADS
# =========================
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# =========================
# MONGODB
# =========================
spring.data.mongodb.uri=mongodb://127.0.0.1:27017/colegio_mongo

GOOGLE_PRIVATE_API_KEY=${GOOGLE_API_KEY:changeme-google-key}

jwt.secret=${JWT_SECRET_KEY:changeme-jwt-secret-at-least-32-chars}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

app.dominio-institucional=${DOMINIO_EMAIL:example.edu}

# =========================
# LANGCHAIN4J + GEMINI (Smart Assess)
# =========================
langchain4j.google-ai-gemini.chat-model.api-key=${GEMINI_API_KEY:changeme-gemini-key}
langchain4j.google-ai-gemini.chat-model.model-name=gemini-3.1-flash-lite
gemini.chat-model.fallback-name=gemini-2.5-flash
langchain4j.google-ai-gemini.chat-model.temperature=0.7
langchain4j.google-ai-gemini.chat-model.log-requests=false
langchain4j.google-ai-gemini.chat-model.log-responses=false

qdrant.host=${QDRANT_HOST:localhost}
qdrant.port=${QDRANT_PORT:6334}

app.gemini.simulado=${GEMINI_SIMULADO:false}